[platformio]
src_dir = firmware
default_envs = modem_bridge

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:modem_bridge]
build_src_filter = +<modem_bridge.cpp>

[env:connectivity_test]
build_src_filter = +<connectivity_test.cpp>

[env:uart_loopback_test]
build_src_filter = +<uart_loopback_test.cpp>

[env:backend_upload_test]
build_src_filter = +<backend_upload_test.cpp>
lib_deps =
  vshymanskyy/TinyGSM@0.12.0
  https://github.com/govorox/SSLClient.git#7dd830679412d4d81384f178843fd38edff2c259
  arduino-libraries/ArduinoHttpClient@0.6.1
  bblanchon/ArduinoJson@6.21.5
build_flags = -DTINY_GSM_MODEM_SIM7600 -DTINY_GSM_RX_BUFFER=1024
